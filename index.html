<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7c6af7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claude Code" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Aprende Claude Code — Desde Cero</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #16161e;
      --surface2: #1e1e2a;
      --border: #2a2a3a;
      --accent: #7c6af7;
      --accent2: #56d6a0;
      --accent3: #f7a76c;
      --text: #e2e2f0;
      --text-muted: #888899;
      --code-bg: #12121a;
      --success: #56d6a0;
      --warning: #f7a76c;
      --danger: #f76c6c;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.65;
    }

    #app-wrap {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #inner-row {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    #sidebar-header .logo .icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    #sidebar-header p {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* progress bar */
    #progress-bar-wrap {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
    }

    #progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    #progress-bar {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* lesson list */
    #lesson-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px;
    }

    #lesson-list::-webkit-scrollbar { width: 4px; }
    #lesson-list::-webkit-scrollbar-track { background: transparent; }
    #lesson-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .lesson-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .lesson-item:hover { background: var(--surface2); }
    .lesson-item.active { background: rgba(124,106,247,0.15); border: 1px solid rgba(124,106,247,0.3); }

    .lesson-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .lesson-item.done .lesson-num {
      background: var(--success);
      color: #0f0f14;
    }

    .lesson-item.active .lesson-num {
      background: var(--accent);
      color: white;
    }

    .lesson-title-wrap { flex: 1; min-width: 0; }
    .lesson-title-wrap .title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lesson-title-wrap .subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }

    .lesson-item.active .lesson-title-wrap .title { color: var(--accent); }

    /* ── Main content ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    #topbar .crumb {
      font-size: 12px;
      color: var(--text-muted);
    }

    #topbar .crumb span { color: var(--accent); }

    #nav-buttons { display: flex; gap: 8px; }

    .nav-btn {
      padding: 7px 16px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }

    .nav-btn:hover { background: var(--border); }
    .nav-btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .nav-btn.primary:hover { background: #6c5ae8; }
    .nav-btn:disabled { opacity: 0.35; cursor: default; }

    #content {
      flex: 1;
      overflow-y: auto;
      padding: 36px 48px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    #content::-webkit-scrollbar { width: 5px; }
    #content::-webkit-scrollbar-track { background: transparent; }
    #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Content styles ── */
    .lesson-header { margin-bottom: 32px; }

    .lesson-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(124,106,247,0.12);
      border: 1px solid rgba(124,106,247,0.25);
      border-radius: 99px;
      padding: 3px 10px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lesson-header h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--text), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .lesson-header .desc {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 600px;
    }

    .section { margin-bottom: 32px; }

    .section h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section h2::before {
      content: '';
      display: block;
      width: 3px; height: 18px;
      background: var(--accent);
      border-radius: 2px;
    }

    .section p { color: var(--text-muted); margin-bottom: 12px; }
    .section p strong { color: var(--text); }
    .section ul, .section ol { padding-left: 20px; color: var(--text-muted); margin-bottom: 12px; }
    .section li { margin-bottom: 6px; }
    .section li strong { color: var(--text); }

    /* code blocks */
    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid var(--border);
    }

    .code-lang {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .copy-btn {
      font-size: 11px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .copy-btn:hover { background: var(--border); color: var(--text); }
    .copy-btn.copied { color: var(--success); }

    .code-block pre {
      padding: 16px;
      overflow-x: auto;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
    }

    .code-block pre .comment { color: #555566; }
    .code-block pre .cmd { color: var(--accent2); }
    .code-block pre .flag { color: var(--warning); }
    .code-block pre .str { color: #f4c2a1; }
    .code-block pre .kw { color: var(--accent); }

    /* inline code */
    code {
      background: rgba(124,106,247,0.12);
      color: #c4b5fd;
      padding: 1px 6px;
      border-radius: 4px;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      font-size: 13px;
    }

    /* callout boxes */
    .callout {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      border-left: 3px solid;
    }

    .callout.tip { background: rgba(86,214,160,0.07); border-color: var(--success); }
    .callout.warning { background: rgba(247,167,108,0.07); border-color: var(--warning); }
    .callout.info { background: rgba(124,106,247,0.07); border-color: var(--accent); }
    .callout.danger { background: rgba(247,108,108,0.07); border-color: var(--danger); }

    .callout-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .callout-body { flex: 1; }
    .callout-body strong { display: block; font-size: 13px; margin-bottom: 4px; color: var(--text); }
    .callout-body p { font-size: 13px; color: var(--text-muted); margin: 0; }

    /* command table */
    .cmd-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .cmd-table th {
      text-align: left;
      padding: 9px 14px;
      background: var(--surface2);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    .cmd-table td {
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--text-muted);
      vertical-align: top;
    }

    .cmd-table td:first-child { color: var(--accent2); font-family: 'Cascadia Code', monospace; }
    .cmd-table tr:last-child td { border-bottom: none; }

    /* quiz */
    .quiz {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }

    .quiz h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quiz-options { display: flex; flex-direction: column; gap: 8px; }

    .quiz-opt {
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quiz-opt:hover { border-color: var(--accent); color: var(--text); }
    .quiz-opt.correct { border-color: var(--success); background: rgba(86,214,160,0.08); color: var(--success); }
    .quiz-opt.wrong { border-color: var(--danger); background: rgba(247,108,108,0.08); color: var(--danger); }
    .quiz-opt .opt-letter {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .quiz-opt.correct .opt-letter { background: var(--success); color: #0f0f14; }
    .quiz-opt.wrong .opt-letter { background: var(--danger); color: white; }

    .quiz-feedback {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .quiz-feedback.show { display: block; }
    .quiz-feedback.correct { background: rgba(86,214,160,0.08); color: var(--success); border: 1px solid rgba(86,214,160,0.2); }
    .quiz-feedback.wrong { background: rgba(247,108,108,0.08); color: #ff9898; border: 1px solid rgba(247,108,108,0.2); }

    /* step timeline */
    .steps { display: flex; flex-direction: column; gap: 0; margin-bottom: 16px; }

    .step-item {
      display: flex;
      gap: 16px;
      padding-bottom: 20px;
      position: relative;
    }

    .step-item:not(:last-child)::after {
      content: '';
      position: absolute;
      left: 15px; top: 34px;
      width: 2px;
      height: calc(100% - 20px);
      background: var(--border);
    }

    .step-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--surface2);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      flex-shrink: 0;
      z-index: 1;
    }

    .step-content { flex: 1; padding-top: 5px; }
    .step-content h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .step-content p { font-size: 13px; color: var(--text-muted); margin: 0; }

    /* badge chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .chip {
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid;
    }
    .chip.blue { background: rgba(124,106,247,0.1); color: var(--accent); border-color: rgba(124,106,247,0.25); }
    .chip.green { background: rgba(86,214,160,0.1); color: var(--accent2); border-color: rgba(86,214,160,0.25); }
    .chip.orange { background: rgba(247,167,108,0.1); color: var(--warning); border-color: rgba(247,167,108,0.25); }

    /* complete button */
    #complete-btn {
      margin-top: 32px;
      padding: 13px 28px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border: none;
      border-radius: var(--radius);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    #complete-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(124,106,247,0.35); }
    #complete-btn.done { background: linear-gradient(135deg, var(--success), #34d399); }
    #complete-btn:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

    /* celebration overlay */
    #celebration {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    #celebration.show { display: flex; }

    .celebration-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 48px;
      text-align: center;
      max-width: 420px;
    }

    .celebration-card .emoji { font-size: 56px; margin-bottom: 16px; }
    .celebration-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .celebration-card p { color: var(--text-muted); margin-bottom: 24px; }
    .celebration-card button {
      padding: 11px 28px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Mobile responsive ── */
    @media (max-width: 700px) {
      #inner-row { flex-direction: column; }
      #install-banner { padding: 10px 14px; gap: 8px; }
      #install-banner .ib-text span { display: none; }

      #sidebar {
        width: 100%;
        min-width: unset;
        border-right: none;
        border-bottom: 1px solid var(--border);
        max-height: 52px;
        overflow: hidden;
        transition: max-height 0.3s ease;
        position: relative;
        z-index: 10;
      }

      #sidebar.open { max-height: 100vh; overflow-y: auto; }

      #sidebar-header {
        padding: 12px 16px;
        cursor: pointer;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      #sidebar-header .logo { margin-bottom: 0; }
      #sidebar-header p { display: none; }

      #sidebar-toggle {
        font-size: 20px;
        color: var(--text-muted);
        user-select: none;
      }

      #progress-bar-wrap { padding: 8px 16px; }
      #lesson-list { padding: 8px; }

      #main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

      #topbar {
        padding: 10px 16px;
        flex-shrink: 0;
      }

      #content {
        padding: 20px 18px 40px;
      }

      .lesson-header h1 { font-size: 22px; }

      #nav-buttons { gap: 6px; }
      .nav-btn { padding: 6px 12px; font-size: 12px; }

      .cmd-table { font-size: 12px; display: block; overflow-x: auto; }

      .celebration-card { padding: 28px 24px; margin: 16px; }
    }

    /* ── Install banner ── */
    #install-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: linear-gradient(135deg, rgba(124,106,247,.18), rgba(86,214,160,.12));
      border-bottom: 1px solid rgba(124,106,247,.3);
      flex-shrink: 0;
      animation: slideDown .3s ease;
    }
    #install-banner.visible { display: flex; }
    @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    #install-banner .ib-left { display: flex; align-items: center; gap: 10px; }
    #install-banner .ib-icon {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
    }
    #install-banner .ib-text strong { display: block; font-size: 13px; color: var(--text); }
    #install-banner .ib-text span { font-size: 12px; color: var(--text-muted); }
    #install-banner .ib-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    #install-btn {
      padding: 8px 18px; background: var(--accent); border: none;
      border-radius: 7px; color: white; font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all .15s; white-space: nowrap;
    }
    #install-btn:hover { background: #6c5ae8; transform: translateY(-1px); }
    #dismiss-btn {
      width: 26px; height: 26px; border-radius: 50%;
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    #dismiss-btn:hover { background: var(--border); color: var(--text); }
  </style>
</head>
<body>

<!-- Wrapper column -->
<div id="app-wrap">

<!-- Install banner -->
<div id="install-banner">
  <div class="ib-left">
    <div class="ib-icon">⚡</div>
    <div class="ib-text">
      <strong>Instalar como app</strong>
      <span>Funciona sin internet · Sin ocupar espacio</span>
    </div>
  </div>
  <div class="ib-actions">
    <button id="install-btn" onclick="triggerInstall()">📲 Instalar</button>
    <button id="dismiss-btn" onclick="dismissBanner()" title="Cerrar">✕</button>
  </div>
</div>

<!-- Inner row: sidebar + main -->
<div id="inner-row">

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header" onclick="toggleSidebar()">
    <div class="logo">
      <div class="icon">⚡</div>
      Claude Code
    </div>
    <p>Aprende desde cero, paso a paso</p>
    <span id="sidebar-toggle">☰</span>
  </div>

  <div id="progress-bar-wrap">
    <div id="progress-label">
      <span>Progreso</span>
      <span id="progress-text">0 / 10 lecciones</span>
    </div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
  </div>

  <div id="lesson-list"></div>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <div class="crumb" id="breadcrumb">Lección <span id="crumb-num">1</span> de 10</div>
    <div id="nav-buttons">
      <button class="nav-btn" id="prev-btn" onclick="navigate(-1)">← Anterior</button>
      <button class="nav-btn primary" id="next-btn" onclick="navigate(1)">Siguiente →</button>
    </div>
  </div>
  <div id="content"></div>
</div>

<!-- Close inner-row and app-wrap -->
</div></div>

<!-- Celebration -->
<div id="celebration">
  <div class="celebration-card">
    <div class="emoji">🎉</div>
    <h2>¡Lección completada!</h2>
    <p id="cel-msg">Sigue así, vas muy bien.</p>
    <button onclick="closeCelebration()">Continuar →</button>
  </div>
</div>

<script>
const LESSONS = [
  {
    title: "¿Qué es Claude Code?",

  'quiz-2': { correct: 'Ejecuta una tarea directa sin sesión interactiva', explanation: '¡Correcto! El flag -p (--print) ejecuta la instrucción y devuelve el resultado sin abrir una sesión interactiva.' },
  'quiz-3': { correct: 'claude --continue', explanation: '¡Correcto! --continue retoma la sesión más reciente con todo su contexto intacto.' },
  'quiz-4': { correct: 'Por defecto te pide confirmación antes de modificar archivos', explanation: '¡Correcto! Claude siempre muestra el diff y pide tu OK antes de hacer cambios. Puedes ver exactamente qué va a cambiar.' },
  'quiz-5': { correct: 'Corre los tests, lee los errores, edita el código y vuelve a correr', explanation: '¡Correcto! Claude hace un loop completo: ejecuta → analiza output → corrige → vuelve a ejecutar hasta que pasen.' },
  'quiz-6': { correct: 'Te muestra los archivos y el mensaje, y pide tu confirmación', explanation: '¡Correcto! Git push y commit son operaciones que afectan el historial, así que Claude siempre te pide confirmación explícita.' },
  'quiz-7': { correct: 'Limpia el historial de conversación, pero no toca los archivos', explanation: '¡Correcto! /clear solo limpia el contexto de la IA. Los archivos que ya se modificaron siguen modificados.' },
  'quiz-8': { correct: 'Automáticamente al iniciar cada sesión', explanation: '¡Correcto! CLAUDE.md se carga automáticamente en cada sesión. Es contexto gratuito y persistente sin que tengas que pedírselo.' },
  'quiz-9': { correct: 'Para pipelines de CI/CD en entornos aislados y controlados', explanation: '¡Correcto! --dangerously-skip-permissions está pensado para automatización en Docker/CI donde no hay humano presente para confirmar.' },
  'quiz-10': { correct: 'Dividir en pasos pequeños, revisar cada cambio e iterar', explanation: '¡Correcto! Iterar en pasos pequeños te permite revisar el trabajo, corregir errores temprano y mantener el control del proceso.' }
};

let currentLesson = 0;
let completed = new Set(JSON.parse(localStorage.getItem('cc_completed') || '[]'));

function saveProgress() {
  localStorage.setItem('cc_completed', JSON.stringify([...completed]));
}

function renderSidebar() {
  const list = document.getElementById('lesson-list');
  list.innerHTML = LESSONS.map((l, i) => `
    <div class="lesson-item ${i === currentLesson ? 'active' : ''} ${completed.has(i) ? 'done' : ''}" onclick="goTo(${i})">
      <div class="lesson-num">${completed.has(i) ? '✓' : i + 1}</div>
      <div class="lesson-title-wrap">
        <div class="title">${l.title}</div>
        <div class="subtitle">${l.subtitle}</div>
      </div>
    </div>
  `).join('');

  const total = LESSONS.length;
  const done = completed.size;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total} lecciones`;
}

function renderContent() {
  const lesson = LESSONS[currentLesson];
  const content = document.getElementById('content');
  content.innerHTML = lesson.content() + `
    <button id="complete-btn" class="${completed.has(currentLesson) ? 'done' : ''}" onclick="completeLesson()">
      ${completed.has(currentLesson) ? '✓ Completada' : '✅ Marcar como completada'}
    </button>
  `;
  content.scrollTop = 0;

  document.getElementById('crumb-num').textContent = currentLesson + 1;
  document.getElementById('prev-btn').disabled = currentLesson === 0;
  document.getElementById('next-btn').textContent = currentLesson === LESSONS.length - 1 ? '🏁 Finalizar' : 'Siguiente →';
}

function navigate(dir) {
  const next = currentLesson + dir;
  if (next >= 0 && next < LESSONS.length) {
    goTo(next);
  }
}

function completeLesson() {
  completed.add(currentLesson);
  saveProgress();
  renderSidebar();

  const btn = document.getElementById('complete-btn');
  btn.textContent = '✓ Completada';
  btn.classList.add('done');

  const cel = document.getElementById('celebration');
  const msg = document.getElementById('cel-msg');

  if (completed.size === LESSONS.length) {
    msg.textContent = '¡Completaste el curso completo de Claude Code! Ahora eres un experto 🎓';
    document.querySelector('.celebration-card .emoji').textContent = '🏆';
    document.querySelector('.celebration-card h2').textContent = '¡Curso completado!';
  } else {
    msg.textContent = `Llevas ${completed.size} de ${LESSONS.length} lecciones. ¡Sigue así!`;
  }

  cel.classList.add('show');
}

function closeCelebration() {
  document.getElementById('celebration').classList.remove('show');
  if (currentLesson < LESSONS.length - 1) {
    navigate(1);
  }
}

function checkQuiz(quizId, el, isCorrect) {
  const quiz = document.getElementById(quizId);
  if (quiz.classList.contains('answered')) return;
  quiz.classList.add('answered');

  const opts = quiz.querySelectorAll('.quiz-opt');
  opts.forEach(o => o.style.pointerEvents = 'none');

  const fb = document.getElementById(quizId + '-fb');
  const answer = QUIZ_ANSWERS[quizId];

  if (isCorrect) {
    el.classList.add('correct');
    fb.textContent = '✅ ' + answer.explanation;
    fb.className = 'quiz-feedback show correct';
  } else {
    el.classList.add('wrong');
    opts.forEach(o => {
      if (o.textContent.trim().includes(answer.correct)) o.classList.add('correct');
    });
    fb.textContent = '❌ Incorrecto. ' + answer.explanation;
    fb.className = 'quiz-feedback show wrong';
  }
}

function copyCode(btn) {
  const pre = btn.closest('.code-block').querySelector('pre');
  const text = pre.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '¡Copiado!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copiar';
      btn.classList.remove('copied');
    }, 1500);
  });
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('open');
}

function goTo(index) {
  currentLesson = index;
  renderSidebar();
  renderContent();
  // Close sidebar on mobile after selecting
  document.getElementById('sidebar').classList.remove('open');
}

// Init
renderSidebar();
renderContent();

// ── PWA install prompt ──
let _installPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  if (!localStorage.getItem('cc_banner_dismissed')) {
    document.getElementById('install-banner').classList.add('visible');
  }
});

window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').classList.remove('visible');
  _installPrompt = null;
});

function triggerInstall() {
  if (!_installPrompt) return;
  _installPrompt.prompt();
  _installPrompt.userChoice.then(r => {
    if (r.outcome === 'accepted') {
      document.getElementById('install-banner').classList.remove('visible');
    }
    _installPrompt = null;
  });
}

function dismissBanner() {
  document.getElementById('install-banner').classList.remove('visible');
  localStorage.setItem('cc_banner_dismissed', '1');
}

// Register service worker for PWA / offline support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
